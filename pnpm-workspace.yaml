# Goodfellow's own releases, which pnpm would otherwise wait a day to install. pnpm wrote these itself.
minimumReleaseAgeExclude:
  - "@goodfellow-cms/blocks@0.6.0"
  - "@goodfellow-cms/core@0.6.0"
  - "@goodfellow-cms/react@0.6.0"
  - create-goodfellow@0.6.0

overrides:
  # As in Goodfellow's own workspace: Puck renders rich text on the server with
  # @tiptap/html, which asks for happy-dom 20; only 21.0.4 and later fix
  # GHSA-834v-8h66-3h79.
  "@puckeditor/core>happy-dom": "^21.0.4"

peerDependencyRules:
  allowedVersions:
    "@tiptap/html>happy-dom": "21"

auditConfig:
  ignoreGhsas:
    # deepmerge, which WordPress's @wordpress/data and @wordpress/components
    # use, has no fixed release. It runs only in the editor, in the plugin's
    # frame in the admin panel, which is sandboxed and holds no sign-in, and
    # never in the site's pages or builds. As in Goodfellow's own workspace.
    - GHSA-gcqx-w48m-w2h4
