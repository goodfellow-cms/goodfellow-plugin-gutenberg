<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gutenberg prototype</title>
    <style>
      html, body, #editor { height: 100%; margin: 0; }
      .prototype { display: grid; grid-template-columns: 1fr 280px; height: 100%; }
      .prototype-canvas { min-width: 0; height: 100%; }
      /* Gutenberg's block tools wrap the canvas, which is as tall as what holds it. */
      .prototype-canvas > * { height: 100%; }
      .prototype-sidebar { border-left: 1px solid #ddd; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
